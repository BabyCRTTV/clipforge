name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch pinned speech engine
        run: python android/prepare.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and test recommendation logic
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/test-results
      - name: Install video fixture generator
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare integration speech and video fixture
        run: python android/test-fixture.py
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native speech, captions, export, gallery, and permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            cd android
            bash gradlew connectedDebugAndroidTest
            mkdir -p app/build/reports/device-preview
            for stage in 0 1 2 3; do
              adb exec-out run-as com.eightbittrade.clipforge cat files/qa-step-$stage.png > app/build/reports/device-preview/step-$stage.png
            done
            adb exec-out run-as com.eightbittrade.clipforge cat cache/pipeline-portrait.mp4 > app/build/reports/device-preview/portrait.mp4
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-results
          path: |
            android/app/build/reports/androidTests
            android/app/build/reports/device-preview
