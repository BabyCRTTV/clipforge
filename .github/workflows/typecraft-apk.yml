name: Build TypeCraft APK

on:
  push:
    branches:
      - typecraft-apk-build
    paths:
      - 'TypeCraftAndroid/**'
      - '.github/workflows/typecraft-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy bundled offline editor
        run: |
          mkdir -p TypeCraftAndroid/app/src/main/assets
          cp TypeCraftAndroid/TypeCraft.html TypeCraftAndroid/app/src/main/assets/index.html
      - name: Compile APK
        run: gradle --project-dir TypeCraftAndroid :app:assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeCraft-APK
          path: TypeCraftAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
